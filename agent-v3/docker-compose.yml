name: enterprise-agent

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-enterprise_knowledge}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      AUTO_SEED: ${AUTO_SEED:-true}
      SEED_TICKETS: ${SEED_TICKETS:-true}
      MIN_RELEVANCE: ${MIN_RELEVANCE:-0.1}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_LOG_SPANS: ${TRACING_LOG_SPANS:-true}
      TRACING_MAX_RECORDS: ${TRACING_MAX_RECORDS:-200}
      TRACING_INCLUDE_IN_RESPONSE: ${TRACING_INCLUDE_IN_RESPONSE:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-enterprise-agent}
      DATA_DIR: /app/data
    volumes:
      - agent_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
  agent_data:

